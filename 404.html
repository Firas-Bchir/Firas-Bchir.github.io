  h1 { margin: 14px 0 0; font-size: clamp(32px, 7vw, 52px); line-height: 1.05; letter-spacing: -.04em; }
  p { margin: 16px 0 0; color: var(--muted); }
  a { display: inline-block; margin-top: 28px; padding: 14px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; }
